services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kmr
      POSTGRES_USER: kmr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kmr -d kmr"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://db:5432/kmr
      DB_USERNAME: kmr
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-kalai}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      MT5_FEED_PASSWORD: ${MT5_FEED_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
